name: kotlin app

on:
  push:
    branches:
      - main
    paths:
      - "focusflowkotlin/**"
      - ".github/workflows/kotlin-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build FocusFlow Kotlin APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: focusflowkotlin
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4g
            -Dorg.gradle.daemon=false

      - name: Publish build summary
        if: always()
        working-directory: focusflowkotlin
        run: |
          {
            echo "## FocusFlow Kotlin APK"
            echo ""
            echo "- **Gradle project:** \`focusflowkotlin\`"
            echo "- **Build:** \`:app:assembleDebug\`"
            echo "- **Run:** \`${{ github.run_number }}\`"
            echo ""
            echo "### APK outputs"
            find app/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-kotlin-debug-apk-run-${{ github.run_number }}
          path: focusflowkotlin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14