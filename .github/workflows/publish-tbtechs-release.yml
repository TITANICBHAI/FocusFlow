name: Publish tbtechs APK Release

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Optional run ID from Build Native Kotlin Release. Leave blank to use the latest successful run on main."
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-tbtechs-release
  cancel-in-progress: false

jobs:
  select_build:
    name: Select successful release build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      run_number: ${{ steps.select.outputs.run_number }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      run_url: ${{ steps.select.outputs.run_url }}
    steps:
      - name: Select build run
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requestedId = String(context.payload.inputs?.build_id ?? "").trim();
            const workflow = await github.rest.actions.getWorkflow({
              owner,
              repo,
              workflow_id: "build-native-kotlin-release.yml",
            });

            let run;
            if (requestedId) {
              if (!/^\d+$/.test(requestedId)) {
                throw new Error("Build run ID must contain digits only.");
              }

              const response = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: Number(requestedId),
              });
              run = response.data;
              if (run.workflow_id !== workflow.data.id) {
                throw new Error("That run does not belong to Build Native Kotlin Release.");
              }
            } else {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflow.data.id,
                branch: "main",
                status: "completed",
                per_page: 100,
              });
              run = response.data.workflow_runs.find(
                (candidate) =>
                  candidate.head_branch === "main" &&
                  candidate.conclusion === "success",
              );
            }

            if (!run) {
              throw new Error("No successful Build Native Kotlin Release run was found on main.");
            }
            if (
              run.workflow_id !== workflow.data.id ||
              run.head_branch !== "main" ||
              run.status !== "completed" ||
              run.conclusion !== "success"
            ) {
              throw new Error("The selected run must be a successful, completed release build from main.");
            }

            core.setOutput("run_id", String(run.id));
            core.setOutput("run_number", String(run.run_number));
            core.setOutput("head_sha", run.head_sha);
            core.setOutput("run_url", run.html_url);
            await core.summary
              .addHeading("Selected tbtechs build")
              .addTable([
                ["Build run", `[${run.id}](${run.html_url})`],
                ["Source commit", `\`${run.head_sha}\``],
                ["APK assets", "tbtechs ARM64, ARM32, and universal only"],
              ])
              .write();

  publish:
    name: Publish tbtechs release
    needs: select_build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out selected build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.select_build.outputs.head_sha }}
          fetch-depth: 0

      - name: Test release notes and changelog
        run: python3 scripts/test_generate_github_release_notes.py

      - name: Set up Android SDK tools for APK verification
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Read version metadata from Gradle
        id: metadata
        env:
          BUILD_RUN_NUMBER: ${{ needs.select_build.outputs.run_number }}
        run: |
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION_NAME" || ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read versionName and versionCode from app/build.gradle.kts."
            exit 1
          fi

          RELEASE_TAG="v${VERSION_NAME}-vc${VERSION_CODE}"
          ARTIFACT_ARM64="focusflow-tbtechs-arm64-v8a-release-v${VERSION_NAME}-vc${VERSION_CODE}-run-${BUILD_RUN_NUMBER}"
          ARTIFACT_ARM32="focusflow-tbtechs-armeabi-v7a-release-v${VERSION_NAME}-vc${VERSION_CODE}-run-${BUILD_RUN_NUMBER}"
          ARTIFACT_UNIVERSAL="focusflow-tbtechs-universal-release-v${VERSION_NAME}-vc${VERSION_CODE}-run-${BUILD_RUN_NUMBER}"
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "release_tag=$RELEASE_TAG"
            echo "artifact_arm64=$ARTIFACT_ARM64"
            echo "artifact_arm32=$ARTIFACT_ARM32"
            echo "artifact_universal=$ARTIFACT_UNIVERSAL"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release metadata"
            echo "- **Version:** $VERSION_NAME"
            echo "- **versionCode:** $VERSION_CODE"
            echo "- **Source build:** ${{ needs.select_build.outputs.run_url }}"
            echo "- **tbtechs APK artifacts:** ARM64, ARM32, universal"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to overwrite an existing release tag
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        with:
          script: |
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${process.env.RELEASE_TAG}`,
              });
              throw new Error(`Tag ${process.env.RELEASE_TAG} already exists; refusing to overwrite a release.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Download the tbtechs ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_arm64 }}
          path: release-download/arm64-v8a
          run-id: ${{ needs.select_build.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Download the tbtechs ARM32 APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_arm32 }}
          path: release-download/armeabi-v7a
          run-id: ${{ needs.select_build.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Download the tbtechs universal APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_universal }}
          path: release-download/universal
          run-id: ${{ needs.select_build.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Verify and stage all three tbtechs APKs
        id: stage
        env:
          EXPECTED_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          if [[ ! -x "$AAPT" || ! -x "$APKSIGNER" ]]; then
            echo "::error::Android build-tools 35.0.0 are unavailable."
            exit 1
          fi

          mkdir -p release-asset
          verify_and_stage_apk() {
            local variant="$1"
            local expected_abi="$2"
            local directory="release-download/$variant"
            local expected_filename="app-production-${expected_abi}-release.apk"
            local apk_count
            local apk
            local badging
            local package_name
            local apk_version_code
            local apk_version_name
            local asset_name
            local asset_path
            local sha256
            local output_key
            local -a apks

            mapfile -t apks < <(find "$directory" -type f -name '*.apk' -print)
            apk_count="${#apks[@]}"
            if [[ "$apk_count" -ne 1 ]]; then
              echo "::error::Expected one $variant tbtechs APK, found $apk_count."
              find "$directory" -maxdepth 4 -type f -print || true
              exit 1
            fi

            apk="${apks[0]}"
            if [[ "$(basename "$apk")" != "$expected_filename" ]]; then
              echo "::error::Unexpected APK for $variant: $(basename "$apk")"
              exit 1
            fi

            badging="$("$AAPT" dump badging "$apk")"
            package_name="$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<< "$badging" | head -n 1)"
            apk_version_code="$(sed -nE "s/^package:.*versionCode='([^']+)'.*/\1/p" <<< "$badging" | head -n 1)"
            apk_version_name="$(sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" <<< "$badging" | head -n 1)"
            if [[ "$package_name" != "com.tbtechs.focusflow" ]]; then
              echo "::error::Expected tbtechs package com.tbtechs.focusflow, found '$package_name'."
              exit 1
            fi
            if [[ "$apk_version_code" != "$EXPECTED_VERSION_CODE" || "$apk_version_name" != "$EXPECTED_VERSION_NAME" ]]; then
              echo "::error::APK version metadata does not match the selected build's Gradle version."
              echo "Expected $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE); found $apk_version_name ($apk_version_code)."
              exit 1
            fi
            "$APKSIGNER" verify "$apk"

            asset_name="FocusFlow-tbtechs-${variant}-v${EXPECTED_VERSION_NAME}-vc${EXPECTED_VERSION_CODE}.apk"
            asset_path="release-asset/$asset_name"
            cp "$apk" "$asset_path"
            sha256="$(sha256sum "$asset_path" | awk '{print $1}')"
            output_key="${variant//-/_}"
            {
              echo "${output_key}_path=$asset_path"
              echo "${output_key}_name=$asset_name"
              echo "${output_key}_sha256=$sha256"
            } >> "$GITHUB_OUTPUT"
            printf '%s\t%s\t%s\n' "$variant" "$asset_name" "$sha256"
          }

          {
            verify_and_stage_apk arm64-v8a arm64-v8a
            verify_and_stage_apk armeabi-v7a armeabi-v7a
            verify_and_stage_apk universal universal
          } | tee /tmp/verified-tbtechs-apks.tsv
          {
            echo "### Verified tbtechs APKs"
            echo "- Package: \`com.tbtechs.focusflow\`"
            echo "- Version: $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"
            echo "- APK signatures: verified for ARM64, ARM32, and universal"
            while IFS=$'\t' read -r variant asset_name sha256; do
              echo "- **$variant:** \`$asset_name\` — SHA-256 \`$sha256\`"
            done < /tmp/verified-tbtechs-apks.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate changelog and install instructions
        env:
          BUILD_SHA: ${{ needs.select_build.outputs.head_sha }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          APK_ARM64_NAME: ${{ steps.stage.outputs.arm64_v8a_name }}
          APK_ARM32_NAME: ${{ steps.stage.outputs.armeabi_v7a_name }}
          APK_UNIVERSAL_NAME: ${{ steps.stage.outputs.universal_name }}
        run: |
          python3 scripts/generate_github_release_notes.py \
            --changelog app/src/main/assets/changelog.json \
            --output release-notes.md \
            --version-name "$VERSION_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --source-sha "$BUILD_SHA" \
            --apk-arm64-name "$APK_ARM64_NAME" \
            --apk-arm32-name "$APK_ARM32_NAME" \
            --apk-universal-name "$APK_UNIVERSAL_NAME"

      - name: Publish GitHub release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          target_commitish: ${{ needs.select_build.outputs.head_sha }}
          name: FocusFlow v${{ steps.metadata.outputs.version_name }} — TBTechs
          body_path: release-notes.md
          files: |
            ${{ steps.stage.outputs.arm64_v8a_path }}
            ${{ steps.stage.outputs.armeabi_v7a_path }}
            ${{ steps.stage.outputs.universal_path }}
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: false
          prerelease: false
          make_latest: true

      - name: Add published release link to the summary
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          echo "### Published release" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Assets: ARM64, ARM32, and universal tbtechs APKs" >> "$GITHUB_STEP_SUMMARY"
