name: Release Indus (Tag)

# Builds the Indus Appstore AAB as a workflow artifact whenever an indus-v* tag
# is pushed (for example, indus-v1.1.0). It intentionally does not create a
# GitHub Release; only the Play release workflow publishes release assets.

on:
  push:
    tags:
      - 'indus-v*'

permissions:
  contents: write

env:
  NPM_CONFIG_NODE_LINKER: hoisted
  EXPO_ROUTER_APP_ROOT: app

jobs:
  release:
    name: Indus Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Read app version
        id: app-version
        working-directory: artifacts/focusflow
        run: |
          VERSION=$(node -e "const j=require('./app.json'); console.log(j.expo.version)")
          VCODE=$(node -e "const j=require('./app.json'); console.log(j.expo.android.versionCode)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "versionCode=$VCODE" >> $GITHUB_OUTPUT
          echo "### Indus Release Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- **App Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **versionCode:** $VCODE" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** com.tbtechsdev.focusflow" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** Indus AAB artifact" >> $GITHUB_STEP_SUMMARY

      - name: Expo Prebuild
        working-directory: artifacts/focusflow
        run: npx expo prebuild --platform android --clean --no-install

      - name: Inject ProGuard rules
        working-directory: artifacts/focusflow
        run: |
          if [ -f proguard-rules.pro ]; then
            cp proguard-rules.pro android/app/proguard-rules.pro
          fi

      - name: Enable R8 full mode
        working-directory: artifacts/focusflow/android
        run: |
          echo "" >> gradle.properties
          echo "android.enableR8.fullMode=true" >> gradle.properties

      - name: Patch signing config — enable v1 + v2 + v3
        working-directory: artifacts/focusflow/android
        run: |
          python3 - << 'PYEOF'
          import re

          path = 'app/build.gradle'
          text = open(path).read()

          sig_block = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword (System.getenv("RELEASE_STORE_PASSWORD") ?: "")
                      keyAlias     (System.getenv("RELEASE_KEY_ALIAS")        ?: "")
                      keyPassword  (System.getenv("RELEASE_KEY_PASSWORD")     ?: "")
                      v1SigningEnabled true
                      v2SigningEnabled true
                      enableV3Signing true
                  }
              }'''

          text = re.sub(
              r'\n?[ \t]*signingConfigs\s*\{(?:[^{}]|\{[^{}]*\})*\}',
              '',
              text,
              flags=re.DOTALL,
          )

          text = re.sub(
              r'(\n[ \t]*buildTypes\s*\{)',
              sig_block + r'\1',
              text,
              count=1,
          )

          def patch_release(m):
              s = m.group(0)
              s = re.sub(r'signingConfig\s+\S+', 'signingConfig signingConfigs.release', s)
              if 'signingConfig' not in s:
                  s = re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
              return s

          def patch_build_types(m):
              return re.sub(r'(?s)\brelease\s*\{[^{}]*\}', patch_release, m.group(0))

          text = re.sub(r'(?s)\bbuildTypes\s*\{(?:[^{}]|\{[^{}]*\})*\}', patch_build_types, text)
          open(path, 'w').write(text)
          print('v1+v2+v3 signing patched into app/build.gradle')
          PYEOF

      - name: Decode release keystore
        working-directory: artifacts/focusflow/android/app
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Disable ABI splits for Indus AAB
        working-directory: artifacts/focusflow/android
        run: |
          sed -i '/splits\s*{/,/^[[:space:]]*}/ {
            s/enable\s*true/enable false/g
          }' app/build.gradle || true
          echo "android.splits.abi.enable=false" >> gradle.properties
          echo "android.splits.density.enable=false" >> gradle.properties

      - name: Build Indus AAB artifact
        working-directory: artifacts/focusflow/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew bundleIndusRelease --no-daemon
          AAB=app/build/outputs/bundle/indusRelease/app-indus-release.aab
          test -f "$AAB"
          ls -lh "$AAB"

      - name: Upload Indus AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusflow-indus-aab-v${{ steps.app-version.outputs.version }}-vc${{ steps.app-version.outputs.versionCode }}-${{ github.ref_name }}
          path: artifacts/focusflow/android/app/build/outputs/bundle/indusRelease/app-indus-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore from runner
        if: always()
        run: |
          if [ -f artifacts/focusflow/android/app/release.keystore ]; then
            rm -f artifacts/focusflow/android/app/release.keystore
          fi